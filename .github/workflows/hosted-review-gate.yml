name: Hosted review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck after reconciling discussions
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: write
  statuses: write

concurrency:
  group: hosted-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # One-time maintainer bootstrap for #71. Create this update/deletion-
      # protected tag only after final-head review: the workflow definition,
      # not just its checkout, must be immutable at dispatch. No branch dispatch
      # or PR-supplied checkout input selects the bootstrap implementation.
      - name: Verify scoped quota-policy bootstrap
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/tags/recordbench-quota-policy-bootstrap-20260912-v1' && inputs.pr_number == '71'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_POLICY_HEAD: ${{ github.sha }}
          BOOTSTRAP_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          test "$BOOTSTRAP_REF_PROTECTED" = "true"
          test "$(gh api repos/neilofneils404/recordbench-oss/pulls/71 --jq '.head.sha')" = "$EXPECTED_POLICY_HEAD"
          test "$(gh api repos/neilofneils404/recordbench-oss/pulls/71 --jq '.base.sha')" = "129bb3aef6edf511d3e4e709b2e89015c685c313"
      # All ordinary events use trusted default-branch code. The scoped manual
      # bootstrap uses a literal reviewed commit, never the PR head.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/tags/recordbench-quota-policy-bootstrap-20260912-v1' && inputs.pr_number == '71' && 'dbff807336a96e067a8a1431e5cf1f69caf275cc' || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify hosted reviews and discussion resolution
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: python3 scripts/hosted-review-gate.py
