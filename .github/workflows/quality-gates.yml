name: Quality gates

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Select Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install document and media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg imagemagick poppler-utils tesseract-ocr \
            tesseract-ocr-eng tesseract-ocr-spa
      - name: Install application test environment
        run: python -m pip install --disable-pip-version-check -e '.[dev,postgres]'
      - name: Check out exact publication head separately
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: _publication_head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact publication checkout
        working-directory: _publication_head
        env:
          EXPECTED_PUBLICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PUBLICATION_SHA"
      - name: Scan tree and Git history
        working-directory: _publication_head
        run: python scripts/publication-check.py
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run application suite
        env:
          # Hosted runners are intentionally smaller than supported review nodes.
          # Production keeps the 100 GiB default from recordbench.env.example.
          CASE_INTELLIGENCE_STORAGE_RESERVE_GIB: "0"
        run: python -m pytest -q

  transcription:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/transcription/pyproject.toml
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install transcription test environment
        run: python -m pip install --disable-pip-version-check -e './services/transcription[dev]'
      - name: Run bundled transcription suite
        working-directory: services/transcription
        run: python -m pytest -q

  deployment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Validate standard and Kerberos Compose graphs
        run: ./scripts/compose-check.sh
      - name: Exercise automation-safe installer output
        run: >-
          ./install install --root /tmp/recordbench-ci-node --auth local
          --models none --server-name recordbench.example.test
          --bind-address 127.0.0.1 --https-port 18443 --non-interactive
          --prepare-only --dry-run --no-color
