name: Quality gates

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified secret scanner
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan fetched history without publishing matched values
        run: |
          if ! /tmp/gitleaks git --redact --no-banner --log-opts='--all' > /tmp/secret-scan.log 2>&1; then
            echo 'Secret scan blocked. Maintainer must inspect privately; no matched values or artifacts uploaded.'
            exit 1
          fi

  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Select Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install document and media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg imagemagick poppler-utils tesseract-ocr \
            tesseract-ocr-eng tesseract-ocr-spa
      - name: Bootstrap contributor environment
        run: make bootstrap SYSTEM_PYTHON=python
      - name: Verify repeatable setup
        run: make bootstrap SYSTEM_PYTHON=python
      - name: Check out exact publication head separately
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: _publication_head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact publication checkout
        working-directory: _publication_head
        env:
          EXPECTED_PUBLICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PUBLICATION_SHA"
      - name: Scan exact candidate tree and complete reachable history
        if: ${{ !github.event.deleted }}
        working-directory: _publication_head
        env:
          EXPECTED_PUBLICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLICATION_REF: ${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
        run: |
          ../.venv/bin/python scripts/check-publication-candidate.py \
            --expected-head "$EXPECTED_PUBLICATION_SHA" \
            --publication-ref "$PUBLICATION_REF"
      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q src scripts tests
      - name: Run application suite
        env:
          # Hosted runners are intentionally smaller than supported review nodes.
          # Production keeps the 100 GiB default from recordbench.env.example.
          CASE_INTELLIGENCE_STORAGE_RESERVE_GIB: "0"
        run: .venv/bin/python -m pytest -q

  transcription:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/transcription/pyproject.toml
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install transcription test environment
        run: python -m pip install --disable-pip-version-check -e './services/transcription[dev]'
      - name: Run bundled transcription suite
        working-directory: services/transcription
        run: python -m pytest -q

  deployment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Validate standard and Kerberos Compose graphs
        run: ./scripts/compose-check.sh
      - name: Exercise read-only installer diagnostics
        run: |
          python3 - <<'PYCODE'
          import json
          import pathlib
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory() as temporary:
              root = pathlib.Path(temporary) / "uncreated node"
              result = subprocess.run(
                  ["./install", "preflight", "--root", str(root), "--models", "none", "--json"],
                  capture_output=True, text=True, timeout=90,
              )
              payload = json.loads(result.stdout)
              assert payload["schema_version"] == 1
              assert payload["checks"]
              blocked = any(row["blocking"] and row["state"] != "pass" for row in payload["checks"])
              assert payload["ready"] is (not blocked)
              assert result.returncode == (1 if blocked else 0)
              assert all(row["remedy"] for row in payload["checks"] if row["blocking"] and row["state"] != "pass")
              assert not root.exists()
          PYCODE
