[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recordbench"
version = "0.1.0"
description = "Local-first evidence and matter review workbench for RecordBench"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "authlib>=1.7.2,<1.8",
  "fastapi>=0.116,<0.117",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4,<5",
  "pydantic>=2,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "selenium>=4.29,<5"]
postgres = ["psycopg[binary]>=3.2,<4"]
models = ["sentence-transformers>=5,<6"]

[project.scripts]
case-review-bench = "case_intelligence.review_bench:main"
case-intelligence-workbench = "case_intelligence.workbench:main"
recordbench = "case_intelligence.admin_cli:main"
recordbench-workbench = "case_intelligence.workbench:main"
recordbench-retrieval-worker = "case_intelligence.retrieval_worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
case_intelligence = [
  "demo_data/*.json",
  "demo_data/*.pdf",
  "demo_data/sources/*/*",
  "demo_data/sources/*/*/*",
  "docx_extract_helper.py",
  "migrations/postgresql/*.sql",
  "migrations/sqlite/*.sql",
  "static/*",
  "templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
